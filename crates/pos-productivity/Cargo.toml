[package]
name = "pos-productivity"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = { version = "0.2", features = ["serde", "tzdb-bundle-always"] }
pos-change = { path = "../pos-change" }
pos-vault = { path = "../pos-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
